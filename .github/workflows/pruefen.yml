name: Modelle und Testskript prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selbsttest:
    name: Python 3.12 auf ${{ matrix.system }}
    runs-on: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python bereitstellen
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Pakete installieren
        run: python -m pip install -r requirements.txt
      - name: Beide ONNX-Modelle ausführen
        run: python -B testen.py --selbsttest
